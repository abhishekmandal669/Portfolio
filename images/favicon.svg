<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="cyber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2ff"/>
      <stop offset="50%" stop-color="#00ff88"/>
      <stop offset="100%" stop-color="#9d4edd"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Dark Circle -->
  <rect width="64" height="64" rx="16" fill="#050811"/>
  <rect width="60" height="60" x="2" y="2" rx="14" fill="#0a0f1d" stroke="url(#cyber-grad)" stroke-width="2"/>

  <!-- Cyber Shield Path -->
  <path d="M32 10 L48 17 V29 C48 40.5 41.2 50.8 32 54 C22.8 50.8 16 40.5 16 29 V17 Z" 
        fill="rgba(0, 242, 255, 0.12)" 
        stroke="url(#cyber-grad)" 
        stroke-width="2.5" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Code / Terminal / Core Icon inside Shield -->
  <!-- Checkmark / Terminal Prompt Accent -->
  <path d="M26 27 L30 31 L38 23" fill="none" stroke="#00ff88" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M25 38 L39 38" stroke="#00f2ff" stroke-width="2.5" stroke-linecap="round"/>
</svg>
